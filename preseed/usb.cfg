# Generated by bootstrap_debian; Debian 13 trixie.
# Internal target disk is explicitly selected and confirmed in the installer.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i hw-detect/load_firmware boolean true
d-i apt-setup/non-free-firmware boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string library
d-i netcfg/get_domain string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i passwd/root-login boolean true
d-i passwd/root-password password library
d-i passwd/root-password-again password library
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Library
d-i passwd/username string library
d-i passwd/user-password password library
d-i passwd/user-password-again password library
d-i passwd/user-default-groups string audio cdrom video sudo plugdev netdev
d-i clock-setup/utc boolean true
d-i time/zone string US/Mountain
d-i partman/early_command string /bin/sh /library-select-target.sh
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select library
d-i partman-auto/expert_recipe string library :: 512 512 512 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . 32000 32000 32000 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . 1024 10000 -1 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /home } .
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
popularity-contest popularity-contest/participate boolean false
tasksel tasksel/first multiselect standard, desktop, gnome-desktop, ssh-server
d-i pkgsel/include string sudo openssh-server ca-certificates git task-gnome-desktop
d-i grub-installer/only_debian boolean true
d-i grub-installer/update-nvram boolean true
d-i grub-installer/with_other_os boolean true
# GRUB target is set to the disk chosen by library-select-target.sh.
d-i finish-install/reboot_in_progress note
# Select and format the separate Library USB manually in the partitioner.
# Set ext4, label Library, mount point /Library before confirming writes.

# GNOME defaults: no automatic lock, display blanking and battery sleep at one hour; no AC sleep.
d-i preseed/late_command string /bin/sh /library-root-access.sh /target || exit 1; /bin/sh /library-clone-library.sh /target; mkdir -p /target/usr/share/glib-2.0/schemas; for setting in '[org.gnome.desktop.screensaver]' 'lock-enabled=false' '' '[org.gnome.desktop.session]' 'idle-delay=3600' '' '[org.gnome.settings-daemon.plugins.power]' 'idle-dim=false' 'sleep-inactive-ac-timeout=0' 'sleep-inactive-ac-type="nothing"' 'sleep-inactive-battery-timeout=3600'; do echo "$setting"; done > /target/usr/share/glib-2.0/schemas/90-library-desktop.gschema.override; if [ -x /target/usr/bin/glib-compile-schemas ]; then in-target glib-compile-schemas /usr/share/glib-2.0/schemas || logger -t library-desktop "WARNING: GNOME schema compilation failed; installation will continue"; else logger -t library-desktop "WARNING: GNOME schema compiler missing; installation will continue"; fi; true
